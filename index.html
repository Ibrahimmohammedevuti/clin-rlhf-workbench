      function calculateCompositeClinicalScore(rubric) {
        const diag = Math.min(5, Math.max(1, Number(rubric.diagnosticSensitivity) || 5));
        const pharm = Math.min(5, Math.max(1, Number(rubric.pharmacotherapeuticSafety) || 5));
        const guide = Math.min(5, Math.max(1, Number(rubric.guidelineAdherence) || 5));
        const rawAverage = Number(((diag + pharm + guide) / 3).toFixed(2));
        const weightedBase = (diag * 0.25 + pharm * 0.45 + guide * 0.30) * 20;

        let safetyGateStatus = 'PASS';
        if (rubric.hallucinationSeverity === 'Critical Harm') {
          safetyGateStatus = 'HARD_VETO_CRITICAL_HARM';
        } else if (rubric.hallucinationSeverity === 'Minor') {
          safetyGateStatus = 'WARN';
        }

        const compositeScore = Math.max(0, Math.min(100, Math.round(weightedBase)));
        const dpoWeightMap = {
          'A >> B': 1.0,
          'A > B': 0.65,
          'Tie': 0.1,
          'B > A': 0.95,
        };
        return {
          rawAverage,
          compositeScore,
          safetyGateStatus,
          dpoBetaWeight: dpoWeightMap[rubric.preferenceRanking] ?? 0.85,
        };
      }

      function resolveChosenAndRejected(clinicalCase, rubric) {
        const textA = clinicalCase.candidateA.rawText;
        const textB = clinicalCase.candidateB.rawText;
        const golden = clinicalCase.goldenReference.rewriteText;

        if (rubric.useGoldenAsChosen) {
          if (rubric.preferenceRanking === 'A >> B' || rubric.preferenceRanking === 'A > B') {
            return {
              chosen: golden,
              rejected: textB,
              chosenSource: "Dr. Mohammed's Golden Reference Rewrite",
              rejectedSource: clinicalCase.candidateB.modelName,
            };
          }
          return {
            chosen: golden,
            rejected: textA,
            chosenSource: "Dr. Mohammed's Golden Reference Rewrite",
            rejectedSource: clinicalCase.candidateA.modelName,
          };
        }

        if (rubric.preferenceRanking === 'A >> B' || rubric.preferenceRanking === 'A > B') {
          return {
            chosen: textA,
            rejected: textB,
            chosenSource: clinicalCase.candidateA.modelName,
            rejectedSource: clinicalCase.candidateB.modelName,
          };
        }
        return {
          chosen: textB,
          rejected: textA,
          chosenSource: clinicalCase.candidateB.modelName,
          rejectedSource: clinicalCase.candidateA.modelName,
        };
      }

      function buildRlhfJsonlRecord(clinicalCase, rubric, timestampIso = new Date().toISOString()) {
        const { chosen, rejected } = resolveChosenAndRejected(clinicalCase, rubric);
        const metrics = calculateCompositeClinicalScore(rubric);
        const detectedErrors = clinicalCase.candidateA.spans
          .filter((s) => s.isAnnotation && (s.severity === 'critical' || s.severity === 'minor'))
          .map((s) => ({
            span_id: s.id,
            excerpt: s.text,
            severity: s.severity || 'critical',
            category: s.category || 'Pharmacotherapeutic Contraindication',
            explanation: s.explanation || '',
          }));

        return {
          id: clinicalCase.id,
          case_code: clinicalCase.code,
          timestamp: timestampIso,
          prompt: `${clinicalCase.systemPrompt}\n\nCLINICAL VIGNETTE:\n${clinicalCase.clinicalVignette}`,
          system_instruction: clinicalCase.metaPromptArchitecture.zeroHallucinationSystemInstructions,
          chosen,
          rejected,
          preference_ranking: rubric.preferenceRanking,
          hallucination_severity: rubric.hallucinationSeverity,
          rubric_scores: {
            diagnostic_sensitivity: rubric.diagnosticSensitivity,
            pharmacotherapeutic_safety: rubric.pharmacotherapeuticSafety,
            guideline_adherence: rubric.guidelineAdherence,
            composite_clinical_score: metrics.compositeScore,
            safety_gate_status: metrics.safetyGateStatus,
          },
          detected_error_spans: detectedErrors,
          critique: (rubric.auditorCritique || '').trim(),
          auditor: AUDITOR_SIGNATURE,
        };
      }

      function serializeRecordsToJsonl(records) {
        return records.map((r) => JSON.stringify(r)).join('\n') + '\n';
      }

      function countSpanSeverities(spans) {
        let criticalCount = 0;
        let minorCount = 0;
        let verifiedCount = 0;
        for (const s of spans) {
          if (!s.isAnnotation) continue;
          if (s.severity === 'critical') criticalCount++;
          else if (s.severity === 'minor') minorCount++;
          else if (s.severity === 'verified') verifiedCount++;
        }
        return { criticalCount, minorCount, verifiedCount };
      }

      function computeBatchRubricDistribution(batchRecords, activeCase, activeRubric) {
        const effectiveRecords = batchRecords.map((rec) => {
          if (activeCase && activeRubric && rec.id === activeCase.id) {
            const liveMetrics = calculateCompositeClinicalScore(activeRubric);
            return {
              id: rec.id,
              caseCode: rec.case_code,
              diagnosticSensitivity: activeRubric.diagnosticSensitivity,
              pharmacotherapeuticSafety: activeRubric.pharmacotherapeuticSafety,
              guidelineAdherence: activeRubric.guidelineAdherence,
              compositeScore: liveMetrics.compositeScore,
            };
          }
          return {
            id: rec.id,
            caseCode: rec.case_code,
            diagnosticSensitivity: rec.rubric_scores.diagnostic_sensitivity,
            pharmacotherapeuticSafety: rec.rubric_scores.pharmacotherapeutic_safety,
            guidelineAdherence: rec.rubric_scores.guideline_adherence,
            compositeScore: rec.rubric_scores.composite_clinical_score,
          };
        });

        if (activeCase && activeRubric && !effectiveRecords.some((r) => r.id === activeCase.id)) {
          const liveMetrics = calculateCompositeClinicalScore(activeRubric);
          effectiveRecords.push({
            id: activeCase.id,
            caseCode: activeCase.code,
            diagnosticSensitivity: activeRubric.diagnosticSensitivity,
            pharmacotherapeuticSafety: activeRubric.pharmacotherapeuticSafety,
            guidelineAdherence: activeRubric.guidelineAdherence,
            compositeScore: liveMetrics.compositeScore,
          });
        }

        const count = Math.max(1, effectiveRecords.length);
        const calcAxis = (axis, shortLabel, selector) => {
          const vals = effectiveRecords.map(selector);
          const sum = vals.reduce((acc, v) => acc + v, 0);
          const meanScore = Number((sum / count).toFixed(2));
          const minScore = vals.length > 0 ? Math.min(...vals) : 5;
          const lowScoreCount = vals.filter((v) => v <= 3).length;
          return { axis, shortLabel, meanScore, minScore, lowScoreCount };
        };

        const axisSummaries = [
          calcAxis('Diagnostic Sensitivity', 'Sensitivity', (p) => p.diagnosticSensitivity),
          calcAxis('Pharmacotherapy Safety', 'Pharm Safety', (p) => p.pharmacotherapeuticSafety),
          calcAxis('Guideline Adherence', 'Guideline', (p) => p.guidelineAdherence),
        ];

        const sortedByMean = [...axisSummaries].sort((a, b) => a.meanScore - b.meanScore);
        const lowest = sortedByMean[0];
        const highest = sortedByMean[sortedByMean.length - 1];
        const spread = Number((highest.meanScore - lowest.meanScore).toFixed(2));

        let skewStatus = 'BALANCED_HIGH';
        let skewDiagnosis = `Balanced high-alignment distribution across all ${effectiveRecords.length} staged records (Mean >= ${lowest.meanScore.toFixed(2)}/5.00).`;

        if (spread >= 0.4 || lowest.lowScoreCount > 0) {
          if (lowest.meanScore < 4.5 && spread >= 0.25) {
            skewStatus = 'SKEWED_FAILURE_POINT';
            skewDiagnosis = `Dataset skews toward ${lowest.axis} bottlenecks (Batch Mean ${lowest.meanScore.toFixed(2)}/5.00, Min ${lowest.minScore}/5 across ${effectiveRecords.length} cases).`;
          } else if (lowest.meanScore <= 3.5) {
            skewStatus = 'UNIFORM_LOW';
            skewDiagnosis = `Multi-axis clinical degradation detected (Lowest mean: ${lowest.axis} at ${lowest.meanScore.toFixed(2)}/5.00).`;
          }
        }

        return {
          caseSeries: effectiveRecords,
          axisSummaries,
          weakestAxis: lowest.axis,
          skewStatus,
          skewDiagnosis,
        };
      }

          .map((t) => {
            const y = yForVal(t);
            return `
              <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="3 3" />
              <text x="${padLeft - 6}" y="${y + 3}" text-anchor="end" fill="#475569" font-size="10" font-family="IBM Plex Mono">${t}</text>
            `;
          })
          .join('');

        const refY = yForVal(3);
        const refLine = `<line x1="${padLeft}" y1="${refY}" x2="${width - padRight}" y2="${refY}" stroke="#d97706" stroke-dasharray="3 3" stroke-width="1.2" />`;

        if (state.chartMode === 'by-case') {
          const items = batchDistribution.caseSeries;
          const groupW = plotW / Math.max(1, items.length);
          const barW = Math.min(18, Math.max(8, (groupW - 18) / 3));

          const barsSvg = items
            .map((item, idx) => {
              const groupX = padLeft + idx * groupW;
              const centerX = groupX + groupW / 2;
              const startX = centerX - (barW * 3 + 4) / 2;

              const vals = [
                { v: item.diagnosticSensitivity, color: '#1d4ed8', label: 'Sensitivity' },
                { v: item.pharmacotherapeuticSafety, color: '#0f766e', label: 'Pharm Safety' },
                { v: item.guidelineAdherence, color: '#4338ca', label: 'Adherence' },

                .map((bar, bIdx) => {
                  const bx = startX + bIdx * (barW + 2);
                  const by = yForVal(bar.v);
                  const bh = Math.max(1, padTop + plotH - by);
                  return `<rect x="${bx}" y="${by}" width="${barW}" height="${bh}" fill="${bar.color}" rx="2"><title>${escapeHtml(item.caseCode)} — ${bar.label}: ${bar.v}/5</title></rect>`;
                })
                .join('');

              return `
                ${rects}
                <text x="${centerX}" y="${height - 8}" text-anchor="middle" fill="#475569" font-size="10" font-family="IBM Plex Mono">${escapeHtml(item.caseCode)}</text>
              `;
            })
            .join('');

                      data-tab="jsonl-payload"
                      class="px-3 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap shrink-0 cursor-pointer ${
                        state.inspectorTab === 'jsonl-payload'
                          ? 'bg-white text-slate-900 shadow-xs'
                          : 'text-slate-600 hover:text-slate-900'
                      }"
                    >RLHF JSONL Payload (${state.batchRecords.length})</button>
                  </div>
                </div>

                ${
                  state.inspectorTab === 'golden-rewrite'
                    ? `
                  <div role="tabpanel" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div class="lg:col-span-8 space-y-3">
                      <div class="flex items-center justify-between">
                        <div class="text-xs text-slate-500">
                          <span class="font-semibold text-slate-800">Author: ${escapeHtml(activeCase.goldenReference.author)}</span>
                          <span aria-hidden="true" class="mx-2">·</span>
                          <span>Verified: ${escapeHtml(activeCase.goldenReference.lastVerified)}</span>
                        </div>
                        <button
                          type="button"
                          data-action="copy-text"
                          data-copy-type="golden"
                          class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                        >
                          <span>${state.copiedState === 'golden' ? 'Copied Golden Rewrite' : 'Copy Golden Rewrite'}</span>
                        </button>
                      </div>
                      <pre class="p-4 bg-slate-50 border border-slate-200 rounded-md text-xs font-mono text-slate-900 whitespace-pre-wrap leading-relaxed">${escapeHtml(activeCase.goldenReference.rewriteText)}</pre>
                    </div>
                    <div class="lg:col-span-4 space-y-4">
                      <div class="border border-slate-200 rounded-md p-4 bg-slate-50/50 space-y-2.5">
                        <h3 class="text-xs font-bold text-slate-900 font-display">Non-Negotiable Pharmacotherapy Invariants</h3>
                        <ul class="space-y-2 text-xs text-slate-700">
                          ${activeCase.goldenReference.keyPharmacotherapyInvariants
                            .map((inv) => `<li class="p-2.5 bg-white border border-slate-200 rounded leading-relaxed">${escapeHtml(inv)}</li>`)
                            .join('')}
                        </ul>
                      </div>
                      <div class="border border-slate-200 rounded-md p-4 bg-slate-50/50 space-y-2">
                        <h3 class="text-xs font-bold text-slate-900 font-display">Evidence &amp; Society Guideline Anchors</h3>
                        <ul class="space-y-1.5 text-xs text-slate-600 font-mono">
                          ${activeCase.goldenReference.guidelineCitations
                            .map((cite) => `<li class="leading-relaxed">• ${escapeHtml(cite)}</li>`)
                            .join('')}
                        </ul>
                      </div>
                    </div>
                  </div>
                `
                    : state.inspectorTab === 'meta-prompt'
                    ? `
                  <div role="tabpanel" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div class="lg:col-span-7 space-y-3">
                      <div class="flex items-center justify-between">
                        <div class="text-xs font-mono text-slate-600">
                          <span>Architecture Version: ${escapeHtml(activeCase.metaPromptArchitecture.version)}</span>
                          <span aria-hidden="true" class="mx-2">·</span>
                          <span>Zero-Hallucination CoT Protocol</span>
                        </div>
                        <button
                          type="button"
                          data-action="copy-text"
                          data-copy-type="metaprompt"
                          class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                        >
                          <span>${state.copiedState === 'metaprompt' ? 'Copied Meta-Prompt' : 'Copy System Instructions'}</span>
                        </button>
                      </div>
                      <pre class="p-4 bg-slate-900 text-slate-100 border border-slate-800 rounded-md text-xs font-mono whitespace-pre-wrap leading-relaxed">${escapeHtml(activeCase.metaPromptArchitecture.zeroHallucinationSystemInstructions)}</pre>
                    </div>
                    <div class="lg:col-span-5 space-y-3">
                      <h3 class="text-xs font-bold text-slate-900 font-display">Scenario-Specific Hard Safety Gates (${escapeHtml(activeCase.code)})</h3>
                      <div class="space-y-3">
                        ${activeCase.metaPromptArchitecture.safetyGates
                          .map(
                            (g) => `
                            <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-md space-y-1.5 text-xs">
                              <div class="font-bold text-slate-900 font-display">${escapeHtml(g.gate)}</div>
                              <p class="text-slate-700 leading-relaxed">${escapeHtml(g.constraint)}</p>
                              <div class="pt-1 font-mono text-[11px] text-blue-800">Target Check: ${escapeHtml(g.verificationTarget)}</div>
                            </div>
                          `
                          )
                          .join('')}
                      </div>
                    </div>
                  </div>
                `
                    : `
                  <div role="tabpanel" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div class="lg:col-span-7 space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="text-xs font-semibold text-slate-800">Live DPO / RLHF Training Record (\`${escapeHtml(activeCase.code)}.jsonl\`)</div>
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            data-action="copy-text"
                            data-copy-type="jsonl"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                          >
                            <span>${state.copiedState === 'jsonl' ? 'Copied .jsonl Line' : 'Copy Single-Line JSONL'}</span>
                          </button>
                          <button
                            type="button"
                            data-action="export-current-case"
                            class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                          >
                            <span>Download Case .jsonl</span>
                          </button>
                        </div>
                      </div>
                      <pre class="p-4 bg-slate-900 text-slate-100 border border-slate-800 rounded-md text-xs font-mono overflow-x-auto max-h-96 leading-relaxed">${escapeHtml(formattedJsonPreview)}</pre>
                    </div>

                    <div class="lg:col-span-5 space-y-3">
                      <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-slate-900 font-display">Staged Multi-Case RLHF Dataset Queue (${state.batchRecords.length} Records)</h3>
                        <button
                          type="button"
                          data-action="export-full-batch"
                          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded transition-colors whitespace-nowrap shrink-0 cursor-pointer"
                        >
                          <span>Export Full Batch .jsonl (${state.batchRecords.length})</span>
                        </button>
                      </div>
                      <div class="border border-slate-200 rounded-md divide-y divide-slate-200 bg-slate-50/40">
                        ${state.batchRecords
                          .map(
                            (rec) => `
                            <div class="p-3 flex items-center justify-between gap-3 text-xs hover:bg-white transition-colors">
                              <div class="min-w-0">
                                <div class="font-mono font-semibold text-slate-900 truncate">
                                  ${escapeHtml(rec.case_code)} · Pref: ${escapeHtml(rec.preference_ranking)} · Score: ${rec.rubric_scores.composite_clinical_score}/100
                                </div>
                                <div class="text-slate-500 truncate mt-0.5">
                                  Severity: ${escapeHtml(rec.hallucination_severity)} · Auditor: ${escapeHtml(rec.auditor)}
                                </div>
                              </div>
                              ${
                                state.batchRecords.length > 1
                                  ? `
                                <button
                                  type="button"
                                  data-action="remove-batch-record"
                                  data-record-id="${escapeHtml(rec.id)}"
                                  aria-label="Remove ${escapeHtml(rec.case_code)} from batch"
                                  class="p-1.5 text-slate-500 hover:text-red-700 rounded hover:bg-slate-100 transition-colors shrink-0 cursor-pointer"
                                >✕</button>
                              `
                                  : ''
                              }
                            </div>
                          `
                          )
                          .join('')}
                      </div>
                    </div>
                  </div>
                `
                }
              </section>
            </main>

            <footer class="bg-white border-t border-slate-200 px-6 py-5 mt-8">
              <div class="max-w-[1380px] mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-xs text-slate-600">
                <div>
                  <span class="font-semibold text-slate-900">ClinRLHF Workbench: Medical LLM Evaluation &amp; Hallucination Auditor</span>
                  <span aria-hidden="true" class="mx-2">·</span>
                  <span>Authored by Dr. Ibrahim Mohammed (MD | MDCN/R/107127)</span>
                </div>
                <div class="font-mono text-slate-500">
                  Zero-Hallucination Clinical Alignment &amp; Direct Preference Optimization Dataset Curation
                </div>
              </div>
            </footer>
          </div>
        `;
      }

      function syncRubricUpdate(updated) {
        const activeCase = getActiveCase();
        state.rubricByCaseId[activeCase.id] = updated;
        const updatedRecord = buildRlhfJsonlRecord(activeCase, updated);
        if (state.batchRecords.some((r) => r.id === activeCase.id)) {
          state.batchRecords = state.batchRecords.map((r) => (r.id === activeCase.id ? updatedRecord : r));
        }
        renderApp();
      }

      function downloadJsonlFile(records, filename) {
        const jsonlContent = serializeRecordsToJsonl(records);
        const blob = new Blob([jsonlContent], { type: 'application/x-jsonlines;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        triggerNotification(`Exported ${records.length} DPO/RLHF record(s) to ${filename}`);
      }

      // Event Delegation for Clicks, Inputs, and Form Submissions
      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'select-case') {
          const caseId = btn.getAttribute('data-case-id');
          state.isCustomMode = false;
          state.activeCaseId = caseId;
          const target = PRELOADED_CLINICAL_CASES.find((c) => c.id === caseId);
          if (target) {
            state.selectedSpanId = target.candidateA.spans.find((s) => s.isAnnotation)?.id ?? null;
          }
          renderApp();
        } else if (action === 'select-custom-mode') {
          state.isCustomMode = true;
          state.selectedSpanId = state.customCase.candidateA.spans.find((s) => s.isAnnotation)?.id ?? null;
          renderApp();
        } else if (action === 'load-preset') {
          const idx = Number(btn.getAttribute('data-preset-idx') || 0);
          const preset = CUSTOM_PRESETS[idx];
          if (preset) {
            state.customForm.title = preset.title;
            state.customForm.specialty = preset.specialty;
            state.customForm.systemPrompt = preset.systemPrompt;
            state.customForm.clinicalVignette = preset.clinicalVignette;
            state.customForm.validationError = null;
            renderApp();
          }
        } else if (action === 'clear-custom-vignette') {
          state.customForm.clinicalVignette = '';
          state.customForm.validationError = null;
          renderApp();
        } else if (action === 'toggle-highlights') {
          state.showHighlights = !state.showHighlights;
          renderApp();
        } else if (action === 'select-span') {
          state.selectedSpanId = btn.getAttribute('data-span-id');
          renderApp();
        } else if (action === 'reset-rubric') {
          const c = getActiveCase();
          syncRubricUpdate({ ...c.defaultRubric });
          triggerNotification(`Reset rubric scores for ${c.code} to benchmark defaults.`);
        } else if (action === 'set-severity') {
          const sev = btn.getAttribute('data-severity');
          syncRubricUpdate({ ...getActiveRubric(), hallucinationSeverity: sev });
        } else if (action === 'set-preference') {
          const pref = btn.getAttribute('data-preference');
          syncRubricUpdate({ ...getActiveRubric(), preferenceRanking: pref });
        } else if (action === 'set-chart-mode') {
          state.chartMode = btn.getAttribute('data-chart-mode') || 'by-case';
          renderApp();
        } else if (action === 'stage-in-batch') {
          const c = getActiveCase();
          const r = getActiveRubric();
          const newRec = buildRlhfJsonlRecord(c, r);
          if (state.batchRecords.some((item) => item.id === newRec.id)) {
            state.batchRecords = state.batchRecords.map((item) => (item.id === newRec.id ? newRec : item));
          } else {
            state.batchRecords = [...state.batchRecords, newRec];
          }
          triggerNotification(`Staged ${c.code} in RLHF JSONL export queue.`);
        } else if (action === 'export-current-case') {
          const c = getActiveCase();
          const r = getActiveRubric();
          const rec = buildRlhfJsonlRecord(c, r);
          downloadJsonlFile([rec], `clinrlhf_${c.code.toLowerCase()}_dpo.jsonl`);
        } else if (action === 'export-full-batch') {
          const c = getActiveCase();
          const r = getActiveRubric();
          const currentRec = buildRlhfJsonlRecord(c, r);
          const merged = state.batchRecords.some((item) => item.id === currentRec.id)
            ? state.batchRecords.map((item) => (item.id === currentRec.id ? currentRec : item))
            : [...state.batchRecords, currentRec];
          downloadJsonlFile(merged, 'clinrlhf_medical_alignment_dataset.jsonl');
        } else if (action === 'set-inspector-tab') {
          state.inspectorTab = btn.getAttribute('data-tab') || 'golden-rewrite';
          renderApp();
        } else if (action === 'copy-text') {
          const copyType = btn.getAttribute('data-copy-type');
          const c = getActiveCase();
          const r = getActiveRubric();
          let textToCopy = '';
          if (copyType === 'golden') {
            textToCopy = c.goldenReference.rewriteText;
          } else if (copyType === 'metaprompt') {
            textToCopy = c.metaPromptArchitecture.zeroHallucinationSystemInstructions;
          } else if (copyType === 'jsonl') {
            textToCopy = serializeRecordsToJsonl([buildRlhfJsonlRecord(c, r)]).trim();
          }
          try {
            await navigator.clipboard.writeText(textToCopy);
            state.copiedState = copyType;
            renderApp();
            setTimeout(() => {
              state.copiedState = null;
              renderApp();
            }, 2000);
          } catch {
            // ignore clipboard permissions error in headless environments
          }
        } else if (action === 'remove-batch-record') {
          const recId = btn.getAttribute('data-record-id');
          state.batchRecords = state.batchRecords.filter((item) => item.id !== recId);
          renderApp();
        } else if (action === 'dismiss-notification') {
          state.exportNotification = null;
          renderApp();
        }
      });

      document.addEventListener('input', (e) => {
        const target = e.target;
        if (!target) return;

        if (target.id === 'slider-diag-sensitivity') {
          syncRubricUpdate({ ...getActiveRubric(), diagnosticSensitivity: Number(target.value) });
        } else if (target.id === 'slider-pharm-safety') {
          syncRubricUpdate({ ...getActiveRubric(), pharmacotherapeuticSafety: Number(target.value) });
        } else if (target.id === 'slider-guideline-adherence') {
          syncRubricUpdate({ ...getActiveRubric(), guidelineAdherence: Number(target.value) });
        } else if (target.id === 'auditor-critique-input') {
          const activeCase = getActiveCase();
          const updated = { ...getActiveRubric(), auditorCritique: target.value };
          state.rubricByCaseId[activeCase.id] = updated;
        } else if (target.id === 'custom-case-title') {
          state.customForm.title = target.value;
        } else if (target.id === 'custom-case-specialty') {
          state.customForm.specialty = target.value;
        } else if (target.id === 'custom-system-prompt') {
          state.customForm.systemPrompt = target.value;
        } else if (target.id === 'custom-clinical-vignette') {
          state.customForm.clinicalVignette = target.value;
          state.customForm.validationError = null;
        }
      });

      document.addEventListener('change', (e) => {
        const target = e.target;
        if (!target) return;
        if (target.id === 'use-golden-checkbox') {
          syncRubricUpdate({ ...getActiveRubric(), useGoldenAsChosen: Boolean(target.checked) });
        } else if (
          target.id === 'slider-diag-sensitivity' ||
          target.id === 'slider-pharm-safety' ||
          target.id === 'slider-guideline-adherence'
        ) {
          const fieldMap = {
            'slider-diag-sensitivity': 'diagnosticSensitivity',
            'slider-pharm-safety': 'pharmacotherapeuticSafety',
            'slider-guideline-adherence': 'guidelineAdherence',
          };
          syncRubricUpdate({ ...getActiveRubric(), [fieldMap[target.id]]: Number(target.value) });
        }
      });

      document.addEventListener('submit', async (e) => {
        if (e.target && e.target.id === 'custom-vignette-form') {
          e.preventDefault();
          const vig = (state.customForm.clinicalVignette || '').trim();
          if (vig.length < 25) {
            state.customForm.validationError = 'Please enter a clinical vignette of at least 25 characters to audit.';
            renderApp();
            return;
          }
          state.customForm.validationError = null;
          state.isEvaluatingCustom = true;
          renderApp();

          const payload = {
            title: (state.customForm.title || '').trim() || 'Custom Clinical Vignette Audit',
            specialty: (state.customForm.specialty || '').trim() || 'Internal Medicine & Pharmacotherapy',
            systemPrompt:
              (state.customForm.systemPrompt || '').trim() ||
              'You are a clinical decision support model. Provide an acute management plan.',
            clinicalVignette: vig,
          };

          try {
            const response = await fetch('./api/evaluate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ...payload,
                metaPrompt: ZERO_HALLUCINATION_META_PROMPT,
              }),
            });
            if (response.ok) {
              const data = await response.json();
              if (data && data.result) {
                const fallback = synthesizeDeterministicCustomCase(payload);
                state.customCase = {
                  ...fallback,
                  title: payload.title,
                  specialty: payload.specialty,
                  systemPrompt: payload.systemPrompt,
                  clinicalVignette: payload.clinicalVignette,
                  coreTestObjective: String(data.result.coreTestObjective || fallback.coreTestObjective),
                };
                state.rubricByCaseId[state.customCase.id] = { ...state.customCase.defaultRubric };
                state.selectedSpanId = state.customCase.candidateA.spans.find((s) => s.isAnnotation)?.id ?? null;
                state.customEvalSource = 'gemini-live';
                state.isEvaluatingCustom = false;
                triggerNotification('Evaluated custom clinical vignette via Server Gemini API.');
                return;
              }
            }
          } catch {
            // Static GitHub Pages fallback
          }

          const synthesized = synthesizeDeterministicCustomCase(payload);
          state.customCase = synthesized;
          state.rubricByCaseId[synthesized.id] = { ...synthesized.defaultRubric };
          state.selectedSpanId = synthesized.candidateA.spans.find((s) => s.isAnnotation)?.id ?? null;
          state.customEvalSource = 'deterministic-engine';
          state.isEvaluatingCustom = false;
          triggerNotification('Synthesized custom clinical audit via Deterministic Pharmacotherapy Engine.');
        }
      });

      // Initial Mount
      renderApp();
    </script>
  </body>
</html>
